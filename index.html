<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5fa;
 color:#222;
}
header{
 background:#1769e0;
 color:white;
 padding:20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
header h2{margin:0}
.add{
 background:white;
 color:#1769e0;
 border:0;
 border-radius:50%;
 width:42px;
 height:42px;
 font-size:28px;
 cursor:pointer;
}
.container{padding:16px;max-width:600px;margin:auto}
.card{
 background:white;
 padding:18px;
 border-radius:14px;
 margin-bottom:15px;
 box-shadow:0 3px 12px #0000000c;
}
.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.stat{
 background:#fff;
 padding:18px 10px;
 border-radius:12px;
 text-align:center;
}
.stat h2{margin:8px 0;color:#1769e0}
.stat p{margin:0;color:#666}
input{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:9px;
 margin:8px 0 15px;
 font-size:16px;
}
button{
 cursor:pointer;
}
.primary{
 width:100%;
 padding:14px;
 background:#1769e0;
 color:white;
 border:0;
 border-radius:9px;
 font-size:16px;
 font-weight:bold;
}
.secondary{
 background:#eee;
 color:#333;
 border:0;
 padding:12px 20px;
 border-radius:8px;
}
.counter{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.counter h3{margin:0 0 7px}
.counter small{color:#666}
.counter button{
 background:#1769e0;
 color:white;
 border:0;
 padding:10px 14px;
 border-radius:8px;
}
.hidden{display:none}
.countNumber{
 font-size:65px;
 font-weight:bold;
 text-align:center;
 margin:25px 0;
 color:#1769e0;
}
.controls{
 display:flex;
 justify-content:center;
 gap:25px;
 margin:25px 0;
}
.controls button{
 width:75px;
 height:75px;
 font-size:38px;
 border:0;
 border-radius:15px;
 color:white;
 background:#1769e0;
}
.controls button:last-child{background:#e74c3c}
.progress{
 height:9px;
 background:#eee;
 border-radius:10px;
 overflow:hidden;
 margin-top:12px;
}
.progress div{
 height:100%;
 background:#16b978;
}
.delete{
 background:#ffe5e5!important;
 color:#e33!important;
}
</style>
</head>

<body>

<header>
 <h2>My Counter</h2>
 <button class="add" onclick="showCreate()">+</button>
</header>

<!-- HOME -->
<div class="container" id="home">

 <div class="stats">
  <div class="stat">
   <p>মোট কাউন্ট</p>
   <h2 id="total">0</h2>
  </div>

  <div class="stat">
   <p>বাকি কাউন্ট</p>
   <h2 id="remaining">0</h2>
  </div>

  <div class="stat" style="grid-column:span 2">
   <p>ইনকাম টাকা</p>
   <h2 id="income">৳ 0</h2>
  </div>
 </div>

 <h3>আমার কাউন্টার</h3>
 <div id="counterList"></div>

</div>

<!-- CREATE PAGE -->
<div class="container hidden" id="create">

 <div class="card">
  <h2>নতুন কাউন্টার তৈরি</h2>

  <label>কাউন্টারের নাম</label>
  <input id="name" placeholder="যেমন: Daily Counter">

  <label>মোট কত কাউন্ট হবে?</label>
  <input id="max" type="number" min="1" placeholder="যেমন: 100">

  <label>প্রতি কাউন্টে কত টাকা?</label>
  <input id="price" type="number" min="0" step="0.01" placeholder="যেমন: 5">

  <button class="primary" onclick="createCounter()">Save Counter</button>
  <br><br>
  <button class="secondary" onclick="goHome()">Back</button>
 </div>

</div>

<!-- ADD COUNT PAGE -->
<div class="container hidden" id="addPage">

 <div class="card">
  <h2 id="activeName">Counter</h2>

  <p style="text-align:center;color:#666">কতটি কাউন্ট যোগ করবেন?</p>

  <div class="countNumber" id="currentCount">0</div>

  <div class="controls">
   <button onclick="changeCount(1)">+</button>
   <button onclick="changeCount(-1)">−</button>
  </div>

  <div class="stats">
   <div class="stat">
    <p>বাকি থাকবে</p>
    <h2 id="previewRemaining">0</h2>
   </div>

   <div class="stat">
    <p>নতুন ইনকাম</p>
    <h2 id="previewIncome">৳ 0</h2>
   </div>
  </div>

  <br>
  <button class="primary" onclick="saveCount()">Save Count</button>
  <br><br>
  <button class="secondary" onclick="goHome()">Back</button>
 </div>

</div>

<script>

let counters = JSON.parse(localStorage.getItem("myCounters")) || [];
let activeId = null;
let temporaryCount = 0;

function saveData(){
 localStorage.setItem("myCounters",JSON.stringify(counters));
}

function showPage(page){
 ["home","create","addPage"].forEach(id=>{
  document.getElementById(id).classList.add("hidden");
 });
 document.getElementById(page).classList.remove("hidden");
}

function showCreate(){
 document.getElementById("name").value="";
 document.getElementById("max").value="";
 document.getElementById("price").value="";
 showPage("create");
}

function createCounter(){

 let name=document.getElementById("name").value.trim();
 let max=parseInt(document.getElementById("max").value);
 let price=parseFloat(document.getElementById("price").value);

 if(!name || !Number.isInteger(max) || max<1 ||
    !Number.isFinite(price) || price<0){
  alert("সঠিক তথ্য দিন");
  return;
 }

 counters.push({
  id:Date.now(),
  name:name,
  total:max,
  price:price,
  completed:0,
  income:0
 });

 saveData();
 goHome();
}

function renderHome(){

 let total=0;
 let remaining=0;
 let income=0;

 counters.forEach(c=>{
  total+=c.total;
  remaining+=c.total-c.completed;
  income+=c.income;
 });

 document.getElementById("total").innerText=total;
 document.getElementById("remaining").innerText=remaining;
 document.getElementById("income").innerText="৳ "+income.toFixed(2);

 let html="";

 counters.forEach(c=>{
  let percent=(c.completed/c.total)*100;

  html+=`
  <div class="card">
   <div class="counter">
    <div>
     <h3>${escapeHTML(c.name)}</h3>
     <small>মোট: ${c.total} | বাকি: ${c.total-c.completed}</small>
    </div>
    <button onclick="openCounter(${c.id})">Add Count</button>
   </div>

   <div class="progress">
    <div style="width:${percent}%"></div>
   </div>

   <p>ইনকাম: ৳ ${c.income.toFixed(2)}</p>
   <small>প্রতি কাউন্ট: ৳ ${c.price}</small>
   <br><br>
   <button class="secondary delete" onclick="deleteCounter(${c.id})">Delete</button>
  </div>`;
 });

 document.getElementById("counterList").innerHTML=
 html || '<div class="card" style="text-align:center">এখনো কোনো কাউন্টার তৈরি করা হয়নি।<br>উপরে + বাটনে ক্লিক করুন।</div>';
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,ch=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

function openCounter(id){
 activeId=id;
 let c=counters.find(x=>x.id===id);
 temporaryCount=0;

 document.getElementById("activeName").innerText=c.name;
 updatePreview();
 showPage("addPage");
}

function changeCount(amount){
 let c=counters.find(x=>x.id===activeId);
 if(!c)return;

 temporaryCount+=amount;

 if(temporaryCount<0)temporaryCount=0;
 if(temporaryCount>c.total-c.completed){
  temporaryCount=c.total-c.completed;
 }

 updatePreview();
}

function updatePreview(){
 let c=counters.find(x=>x.id===activeId);
 if(!c)return;

 document.getElementById("currentCount").innerText=temporaryCount;
 document.getElementById("previewRemaining").innerText=
 c.total-c.completed-temporaryCount;

 document.getElementById("previewIncome").innerText=
 "৳ "+(temporaryCount*c.price).toFixed(2);
}

function saveCount(){
 let c=counters.find(x=>x.id===activeId);
 if(!c || temporaryCount===0){
  alert("আগে কাউন্ট যোগ করুন");
  return;
 }

 c.completed+=temporaryCount;
 c.income=c.completed*c.price;

 saveData();
 alert("কাউন্ট সফলভাবে সেভ হয়েছে!");
 goHome();
}

function deleteCounter(id){
 if(confirm("এই কাউন্টারটি মুছে ফেলতে চান?")){
  counters=counters.filter(c=>c.id!==id);
  saveData();
  renderHome();
 }
}

function goHome(){
 renderHome();
 showPage("home");
}

renderHome();

</script>

</body>
</html>
